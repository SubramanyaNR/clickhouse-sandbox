name: clickhouse-sandbox

x-keeper: &keeper
  image: clickhouse/clickhouse-keeper:25.8
  restart: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:9182/ready >/dev/null"]
    interval: 5s
    timeout: 5s
    retries: 30
  networks: [sandbox]

x-server: &server
  image: clickhouse/clickhouse-server:25.8
  restart: unless-stopped
  ulimits:
    nofile: {soft: 262144, hard: 262144}
  depends_on:
    keeper1: {condition: service_healthy}
    keeper2: {condition: service_healthy}
    keeper3: {condition: service_healthy}
  healthcheck:
    test: ["CMD", "clickhouse-client", "--query", "SELECT 1"]
    interval: 5s
    timeout: 5s
    retries: 30
  networks: [sandbox]

services:
  keeper1:
    <<: *keeper
    container_name: ch-keeper1
    hostname: ch-keeper1
    environment: {KEEPER_ID: 1}
    volumes:
      - ./config/keeper/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper1-data:/var/lib/clickhouse

  keeper2:
    <<: *keeper
    container_name: ch-keeper2
    hostname: ch-keeper2
    environment: {KEEPER_ID: 2}
    volumes:
      - ./config/keeper/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper2-data:/var/lib/clickhouse

  keeper3:
    <<: *keeper
    container_name: ch-keeper3
    hostname: ch-keeper3
    environment: {KEEPER_ID: 3}
    volumes:
      - ./config/keeper/keeper.xml:/etc/clickhouse-keeper/keeper_config.xml:ro
      - keeper3-data:/var/lib/clickhouse

  server1:
    <<: *server
    container_name: ch-server1
    hostname: ch-server1
    environment: {REPLICA: ch-server1}
    ports:
      - "${PORT_PREFIX:-38}123:8123"
      - "${PORT_PREFIX:-38}900:9000"
    volumes:
      - ./config/server/node.xml:/etc/clickhouse-server/config.d/node.xml:ro
      - ./config/server/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./config/layouts/${LAYOUT:-circular}.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/server/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./queries:/queries:ro
      - server1-data:/var/lib/clickhouse

  server2:
    <<: *server
    container_name: ch-server2
    hostname: ch-server2
    environment: {REPLICA: ch-server2}
    ports:
      - "${PORT_PREFIX:-38}124:8123"
    volumes:
      - ./config/server/node.xml:/etc/clickhouse-server/config.d/node.xml:ro
      - ./config/server/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./config/layouts/${LAYOUT:-circular}.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/server/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./queries:/queries:ro
      - server2-data:/var/lib/clickhouse

  server3:
    <<: *server
    container_name: ch-server3
    hostname: ch-server3
    environment: {REPLICA: ch-server3}
    ports:
      - "${PORT_PREFIX:-38}125:8123"
    volumes:
      - ./config/server/node.xml:/etc/clickhouse-server/config.d/node.xml:ro
      - ./config/server/keeper.xml:/etc/clickhouse-server/config.d/keeper.xml:ro
      - ./config/layouts/${LAYOUT:-circular}.xml:/etc/clickhouse-server/config.d/cluster.xml:ro
      - ./config/server/users.xml:/etc/clickhouse-server/users.d/users.xml:ro
      - ./queries:/queries:ro
      - server3-data:/var/lib/clickhouse

  # Generates bankgen data as JSON lines for the loader. Run on demand.
  bankgen:
    build: ./tools
    image: clickhouse-sandbox/bankgen
    profiles: [tools]
    volumes: ["bankgen-data:/data"]
    networks: [sandbox]

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [monitoring]
    container_name: ch-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=3d
      - --web.enable-lifecycle
    ports: ["${PORT_PREFIX:-38}090:9090"]
    volumes:
      - ./prometheus:/etc/prometheus:ro
      - prometheus-data:/prometheus
    networks: [sandbox]

  grafana:
    image: grafana/grafana:12.1.1
    profiles: [monitoring]
    container_name: ch-grafana
    restart: unless-stopped
    ports: ["${PORT_PREFIX:-38}300:3000"]
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_NEWS_NEWS_FEED_ENABLED: "false"
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [sandbox]

networks:
  sandbox:
    name: clickhouse-sandbox

volumes:
  keeper1-data:
  keeper2-data:
  keeper3-data:
  server1-data:
  server2-data:
  server3-data:
  bankgen-data:
  prometheus-data:
  grafana-data:
